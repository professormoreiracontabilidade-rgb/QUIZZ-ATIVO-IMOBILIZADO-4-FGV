<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Professor Moreira — Imobilizado — Quiz 4 — professor</title><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Arial,Helvetica,sans-serif;background:#f5f7fc;color:#142443}body{display:flex;flex-direction:column}header{background:#17295c;color:white;padding:12px 22px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}header strong{font-size:19px}.tag{background:#e8e9ff;color:#273b83;border-radius:30px;padding:6px 12px;font-weight:800}main{flex:1;position:relative;min-height:65vh;display:flex;flex-direction:column;padding:18px 25px 105px}.sheet{background:white;border:2px solid #d9dff0;border-top:8px solid #6854c5;border-radius:15px;box-shadow:0 8px 30px #14244313;padding:clamp(18px,3vw,36px);width:100%;min-height:65vh;position:relative}.intro{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;min-height:65vh}.intro h1{font-size:clamp(29px,4.5vw,58px);line-height:1.15;margin:8px}.intro h2{font-size:clamp(25px,3.5vw,44px);color:#4837a6}.intro p{font-size:24px}.questionTitle{font-size:clamp(19px,2.3vw,29px);color:#4633a5;margin:0 0 12px}.source{font-size:16px;color:#526180;margin-bottom:18px}.statement{font-size:clamp(19px,2vw,28px);line-height:1.5;font-weight:650;white-space:pre-wrap}.option{font-size:clamp(18px,1.7vw,24px);padding:12px 16px;margin:10px 0;border:2px solid #d9dff0;border-radius:10px;line-height:1.35;background:#fff;text-align:left;width:100%;color:inherit}.option.selected{border-color:#6652d0;background:#eeeaff}.option.correct{border-color:#198f52;background:#e6f7ec}.option.wrong{border-color:#c52f3b;background:#ffeaed}.answer{font-size:clamp(19px,1.8vw,25px);line-height:1.65;white-space:pre-wrap;color:#a8182d}.answerKey{font-size:clamp(24px,2.6vw,34px);color:#17824c;font-weight:900;margin-bottom:20px}footer{position:fixed;bottom:0;left:0;right:0;display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;background:#17295c;padding:12px 18px;z-index:9}button{cursor:pointer;border:0;border-radius:10px;background:#eeeaff;color:#2d236d;padding:12px 17px;font-size:16px;font-weight:800}button:disabled{opacity:.4;cursor:default}.primary{background:#6d57d4;color:white}.green{background:#17864a;color:white}.red{background:#b52a39;color:white}.tools{display:flex;align-items:center;gap:7px;flex-wrap:wrap;background:#e9eaf9;padding:8px;border-radius:10px;margin-bottom:12px}.tools button{padding:8px 11px}.tools button.active{outline:3px solid #29296c}.tools label{font-weight:bold}.tools input{vertical-align:middle}#board{position:absolute;inset:0;width:100%;height:100%;touch-action:none;z-index:3;cursor:crosshair;pointer-events:none}.teacher .sheet{min-height:75vh}.teacher main{padding:12px 12px 120px}.teacher .statement{font-size:clamp(21px,2.1vw,30px)}.counter{color:white;font-weight:bold}.score{font-size:clamp(23px,3vw,35px);text-align:center;line-height:1.7} .note{color:#57617d;font-size:15px} @media(max-width:650px){main{padding:9px 9px 125px}.sheet{padding:17px}.option{font-size:18px}footer{justify-content:center;padding:8px}footer button{padding:10px;font-size:14px}header strong{font-size:15px}}</style></head><body class="teacher"><header><strong>CURSO DE CONTABILIDADE • PROFESSOR MOREIRA</strong><span class="tag">FGV | CPC 27 | QUIZ 4 | PROFESSOR</span></header><main><div id="tools" class="tools"><button id="penToggle" onclick="setTool(tool==='off'?'pen':'off')">DESATIVAR CANETA</button><button onclick="setTool('pen')">CANETA</button><button onclick="setTool('highlighter')">MARCA-TEXTO</button><button onclick="setTool('erase')">BORRACHA</button><button onclick="setColor('#e02d32')" style="background:#e02d32;color:white">VERMELHA</button><button onclick="setColor('#1a65d1')" style="background:#1a65d1;color:white">AZUL</button><button onclick="setColor('#161616')" style="background:#161616;color:white">PRETA</button><button onclick="setColor('#18824b')" style="background:#18824b;color:white">VERDE</button><button onclick="color='#f2d01e';setTool('highlighter')" style="background:#f2d01e">AMARELO</button><label>Espessura <input type="range" min="1" max="14" value="3" oninput="size=+this.value"></label><button onclick="clearBoard()">LIMPAR LOUSA</button></div><section class="sheet"><div id="content"></div></section></main><footer><button onclick="prev()" id="prev">← VOLTAR</button><button class="green" onclick="teacherSignal(true)">✓ ACERTOU</button><button class="red" onclick="teacherSignal(false)">✗ ERROU</button><span id="counter" class="counter"></span><button onclick="restart()">↻ REINICIAR</button><button class="primary" onclick="next()" id="next">SEGUIR →</button></footer><script>const Q=[{"n": 31, "source": "FGV - AFTM (Pref Macaé)/Pref Macaé/2024", "statement": "Uma empresa de assessoria tributária adquiriu, à vista, um ar condicionado split para seu escritório por R$8.000. O frete e a instalação foram, respectivamente, de R$100 e R$900, pagos a vista. Além disso, na data da compra, a empresa estimou que os custos de remoção seriam de R$700. Assinale a opção que indica o impacto decorrente da transação no balanço patrimonial da empresa.", "options": [["A", "Aumento de R$700 no ativo e no passivo."], ["B", "Aumento de R$700 no passivo e diminuição de R$700 no patrimônio líquido."], ["C", "Diminuição de R$900 no ativo e no passivo."], ["D", "Diminuição de R$900 no ativo e no patrimônio líquido."], ["E", "Diminuição de R$1.600 no ativo e no patrimônio líquido."]], "answer": "A", "explanation": "Compra do aparelho 8.000 + frete 100 + instalação 900 = R$ 9.000: há entrada de imobilizado e saída de caixa de igual montante, sem variação líquida de ativos por essa parte. A obrigação estimada de remoção de R$ 700, se presente e reconhecível, aumenta simultaneamente o imobilizado e o passivo em R$ 700. Portanto, efeito líquido: ativo +700 e passivo +700. Alternativa A."}, {"n": 32, "source": "FGV - AFTRM (Pref Cuiabá)/Pref Cuiabá/Direito Processo Tributário/2024", "statement": "De acordo com a NBC TG 27 (R4) – Ativo Imobilizado, os usuários das demonstrações contábeis podem entender que algumas informações são relevantes para as suas necessidades, de modo que as entidades são encorajadas a divulgá-las. Avalie se tais informações relevantes incluem: I. Valor contábil do ativo imobilizado que está temporariamente ocioso. II. Valor contábil bruto de ativo imobilizado totalmente depreciado que ainda está em operação. III. Valor contábil de ativos imobilizados retirados de uso ativo e não classificados como mantidos para venda. IV. Valor justo do ativo imobilizado que é materialmente diferente do valor contábil apurado pelo método do custo. Está correto o que se afirma em:", "options": [["A", "I e II, somente."], ["B", "III e IV, somente."], ["C", "I, II e III, somente."], ["D", "II, III e IV, somente."], ["E", "I, II, III e IV."]], "answer": "E", "explanation": "O CPC 27, item 79, encoraja quatro divulgações adicionais: I, imobilizado temporariamente ocioso; II, custo bruto de ativos totalmente depreciados ainda em operação; III, ativos retirados de uso sem classificação como mantidos para venda; IV, valor justo significativamente diferente do contábil pelo modelo de custo. Todas são informações úteis e facultativas encorajadas, não necessariamente obrigatórias. Alternativa E."}, {"n": 33, "source": "FGV - AJ (TJ MT)/TJ MT/Ciências Contábeis/2024", "statement": "Em 01/11/2024, uma sociedade empresária adquiriu móveis planejados para o seu escritório por R$ 30.000 à vista. A vida útil foi estimada em dez anos. Na data, a sociedade empresária estimou os seguintes gastos que serão necessários quando substituir estes móveis recém-adquiridos, no final da sua vida útil: • Desmontagem: R$1.000 • Remoção: R$3.000 • Restauração do local em que estavam localizados: R$5.000 • Compra de móveis similares para substituição: R$35.000 O passivo reconhecido pela entidade na data é", "options": [["A", "zero."], ["B", "R$ 1.000."], ["C", "R$ 4.000."], ["D", "R$ 9.000."], ["E", "R$ 44.000."]], "answer": "D", "explanation": "A obrigação de desmontar (1.000), remover (3.000) e restaurar o local (5.000) pode constituir provisão presente vinculada à instalação dos móveis. Soma: 1.000 + 3.000 + 5.000 = R$ 9.000. A compra futura de móveis substitutos (35.000) é uma decisão de aquisição futura, sem obrigação presente pelo simples planejamento, e fica fora da provisão. Alternativa D."}, {"n": 34, "source": "FGV - Bach (CFC)/CFC/2º Exame de Suficiência/2024", "statement": "De acordo com a NBC TG 27 (R4) – ATIVO IMOBILIZADO, o custo de um item do ativo imobilizado compreende, entre outros, quaisquer custos diretamente atribuíveis para colocar o ativo no local e as condições necessárias para ele ser capaz de funcionar da forma pretendida pela administração. Entre os custos diretamente atribuíveis estão os custos", "options": [["A", "de abertura de nova instalação."], ["B", "incorridos na introdução de novo produto ou serviço."], ["C", "com testes para verificar se o ativo está funcionando corretamente."], ["D", "da transferência das atividades para novo local ou para nova categoria de clientes."]], "answer": "C", "explanation": "O CPC 27, item 17, cita expressamente testes para verificar se o ativo está funcionando corretamente como custos diretamente atribuíveis. Gastos de abertura de instalação, introdução de produto e transferência de atividades para novo local são exemplos de gastos excluídos pelo item 19. Assim, somente os testes descritos podem ser capitalizados. Alternativa C."}, {"n": 35, "source": "FGV - Bach (CFC)/CFC/2º Exame de Suficiência/2024", "statement": "Um hospital localizado no Centro da cidade adquiriu um terreno ao lado de seu prédio para a construção de um estacionamento para ser utilizado, exclusivamente, pelos pacientes, de modo a oferecer melhor atendimento. No Balanço Patrimonial do hospital, o terreno deve ser classificado como", "options": [["A", "Ativo Imobilizado."], ["B", "Ativo Realizável a Longo Prazo."], ["C", "Propriedade para investimento."], ["D", "Ativo não circulante mantido para a venda."]], "answer": "A", "explanation": "O terreno servirá de estacionamento exclusivamente para pacientes, como parte da estrutura de atendimento hospitalar. É bem corpóreo mantido para fornecer serviços, enquadrado no CPC 27. Não foi adquirido para obter aluguel, valorização ou revenda. Terreno é imobilizado e, em regra, não se deprecia. Alternativa A."}, {"n": 36, "source": "FGV - Bach (CFC)/CFC/2º Exame de Suficiência/2024", "statement": "Em 01/01/2020, uma sociedade empresária adquiriu uma van para transportar os seus empregados por R$ 300.000. A vida útil foi estimada em 15 anos e não foi considerado valor residual. Em 2023, essa van apresentou diversos problemas que ocasionaram gastos de R$ 24.000 com reparos. Por conta dos problemas, a sociedade empresária decidiu comprar uma nova van e, em 31/12/2023, vendeu a antiga por R$ 250.000. O lucro obtido com a venda da van, considerando que a sociedade empresária utiliza o método da linha reta para depreciar os seus ativos imobilizados, foi de", "options": [["A", "R$ 6.000."], ["B", "R$ 10.000."], ["C", "R$ 28.000."], ["D", "R$ 30.000."]], "answer": "D", "explanation": "Depreciação anual = 300.000/15 = R$ 20.000. De 2020 a 2023 são quatro exercícios: acumulada = 4 × 20.000 = R$ 80.000. Valor contábil da van em 31/12/2023 = 300.000 − 80.000 = R$ 220.000. Ganho na venda = 250.000 − 220.000 = R$ 30.000. Os R$ 24.000 de reparos são gastos de manutenção, tratados separadamente, e não alteram o ganho de baixa apresentado. Alternativa D."}, {"n": 37, "source": "FGV - AFRE MG/SEF MG/Auditoria e Fiscalização/2023", "statement": "Em 31/12/X0, uma sociedade empresária adquiriu móveis para utilizar em seu negócio por R$ 12.000 para pagamento em um ano. Esse prazo era maior do que os prazos normais de crédito para a sociedade empresária. Se os móveis fossem adquiridos à vista, o valor seria de R$ 10.000. Assinale a opção que indica os lançamentos contábeis realizados pela sociedade empresária na data em que os móveis foram adquiridos.", "options": [["A", "| D-móveis e utensílios: R$ 10.000.<br> D- despesas financeiras a apropriar: R$ 2.000.<br> C- contas a pagar: R$ 12.000. | | ---------------------------------------------------------------------------------------------------------------------- |"], ["B", "| D- móveis e utensílios: R$ 10.000.<br> D- despesas financeiras: R$ 2.000.<br> C- contas a pagar: R$ 12.000. | | ----------------------------------------------------------------------------------------------------------- |"], ["C", "| D- móveis e utensílios: R$ 12.000.<br> C- contas a pagar: R$ 12.000. | | -------------------------------------------------------------------- |"], ["D", "| D- móveis e utensílios: R$ 12.000.<br> C- desconto financeiro: R$ 2.000.<br> C- contas a pagar: R$ 12.000. | | ---------------------------------------------------------------------------------------------------------- |"], ["E", "| D- móveis e utensílios: R$ 12.000.<br> D- despesas financeiras: R$ 2.000.<br> C- caixa: R$ 2.000.<br> C- contas a pagar: R$ 10.000. | | ----------------------------------------------------------------------------------------------------------------------------------- |"]], "answer": "A", "explanation": "Como o prazo de um ano supera as condições normais de crédito, o custo inicial do móvel é o equivalente à vista: R$ 10.000 (CPC 27, item 23). Os R$ 2.000 excedentes representam financiamento a apropriar ao longo do período. Registro inicial: D – Móveis e utensílios 10.000; D – Despesas financeiras a apropriar 2.000 (conta redutora do passivo, conforme plano de contas); C – Contas a pagar 12.000. Alternativa A."}, {"n": 38, "source": "FGV - Aud Est (CGE SC)/CGE SC/Ciências Contábeis/2023", "statement": "Uma sociedade empresária deu início a obras para expansão de seu escritório. Estima-se que a obra tenha dois anos de duração, com início em 02/01/X0 e término em 31/12/X1. Para a obra, foram adquiridos R$40.000 em material de construção. Assinale a opção que indica a contabilização do material de construção no balanço patrimonial da sociedade empresária.", "options": [["A", "R$40.000 em ativo circulante."], ["B", "R$40.000 em ativo realizável a longo prazo."], ["C", "R$40.000 em investimentos."], ["D", "R$40.000 em ativo imobilizado."], ["E", "R$20.000 em ativo circulante e R$20.000 em ativo realizável a longo prazo."]], "answer": "D", "explanation": "Materiais adquiridos especificamente para obra de ampliação do próprio escritório, com realização ao longo de dois anos, integram o projeto de imobilizado em andamento. Não se trata de estoque de mercadorias para venda, nem de investimento financeiro. A classificação apresentada pela banca é R$ 40.000 no ativo imobilizado, a serem incorporados à obra conforme consumo e política contábil. Alternativa D."}, {"n": 39, "source": "FGV - ATRFB/SRFB/Geral/2023", "statement": "De acordo com a NBC TG 27(R4) – Ativo Imobilizado, as demonstrações contábeis devem, obrigatoriamente, divulgar", "options": [["A", "o valor contábil do ativo imobilizado que esteja temporariamente ocioso."], ["B", "o valor dos gastos reconhecidos no valor contábil de um item do ativo imobilizado durante a sua construção."], ["C", "o valor contábil de ativos imobilizados retirados de uso ativo e não classificados como mantidos para venda."], ["D", "o valor contábil bruto de qualquer ativo imobilizado totalmente depreciado que ainda esteja em operação."], ["E", "o valor justo do ativo imobilizado quando este for materialmente diferente do valor contábil apurado pelo método do custo."]], "answer": "B", "explanation": "É importante distinguir divulgações obrigatórias (CPC 27, item 74) das informações adicionais apenas encorajadas (item 79). O montante de gastos reconhecidos no valor contábil do imobilizado durante sua construção é informação exigida. As opções sobre ociosidade, bens totalmente depreciados, retirados de uso e valor justo distinto são encorajadas, não exigidas em todos os casos. Alternativa B."}, {"n": 40, "source": "FGV - AJ (TJ RN)/TJ RN/Administrativa/Contabilidade/2023", "statement": "Uma empresa está instalando uma nova fábrica em sua unidade de produção e incorreu nos seguintes custos: 1. Custo da planta da fábrica (custo da nota fiscal mais impostos): R$ 2.500.000 2. Entrega inicial e o manuseio: R$ 200.000 3. Custo de preparação do local: R$ 600.000 4. Consultores usados para assessoria na aquisição da fábrica (honorários profissionais): R$ 700.000 5. Custos administrativos (não testes): R$ 200.000 6. Custos de desmontagem estimados a serem incorridos após 7 anos: R$ 300.000 7. Perdas operacionais antes da produção comercial: R$ 400.000 Considerando-se apenas as informações apresentadas, os custos que podem ser ativados totalizam:", "options": [["A", "R$ 3.700.000;"], ["B", "R$ 4.100.000;"], ["C", "R$ 4.300.000;"], ["D", "R$ 4.900.000;"], ["E", "R$ 5.800.000."]], "answer": "C", "explanation": "Capitalizáveis: custo da planta 2.500.000 + entrega/manuseio 200.000 + preparação do local 600.000 + honorários de consultores diretamente atribuíveis 700.000 + obrigação estimada de desmontagem 300.000 = R$ 4.300.000. Não capitalizar despesas administrativas gerais de 200.000 nem perdas operacionais iniciais de 400.000 (CPC 27, itens 16–20). Alternativa C."}];const MODE='professor';const GROUP=4;let index=-1,side=0,choices={},marks={},tool='pen',color='#e02d32',size=3;const key='moreira-cpc27-'+MODE+'-'+GROUP;try{const old=JSON.parse(localStorage.getItem(key)||'{}');choices=old.choices||{};marks=old.marks||{}}catch(e){}const $=s=>document.querySelector(s);const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function save(){try{localStorage.setItem(key,JSON.stringify({choices,marks}))}catch(e){}}function intro(){return `<div class="intro"><h1>CURSO DE CONTABILIDADE<br>PROFESSOR MOREIRA</h1><h1>=================</h1><h2>SÓ QUESTÕES DA FGV</h2><h2>ATIVO IMOBILIZADO — CPC 27</h2><p>QUIZ ${GROUP} • QUESTÕES ${Q[0].n} A ${Q[9].n}</p><button class="primary" onclick="next()">COMEÇAR</button></div>`}function qhtml(q){return `<h2 class="questionTitle">QUESTÃO ${String(q.n).padStart(2,'0')} — FGV</h2><div class="source">${esc(q.source)}</div><div class="statement">${esc(q.statement)}</div><div class="options">${q.options.map(o=>`<button class="option ${choices[q.n]===o[0]?'selected':''}" onclick="choose('${o[0]}')" ${MODE==='professor'?'disabled':''}><b>${o[0]})</b> ${esc(o[1])}</button>`).join('')}</div>`}function ahtml(q){let o=q.options.find(x=>x[0]===q.answer);return `<h2 class="questionTitle">RESOLUÇÃO DA QUESTÃO ${String(q.n).padStart(2,'0')}</h2><div class="answerKey">GABARITO: LETRA ${q.answer} — ${esc(o?o[1]:'')}</div><div class="answer">${esc(q.explanation)}</div>`}function score(){let correct=Q.filter(q=>choices[q.n]===q.answer).length,wrong=Q.filter(q=>choices[q.n]&&choices[q.n]!==q.answer).length,blank=10-correct-wrong;return `<div class="intro score"><h2>RESULTADO DO QUIZ ${GROUP}</h2><div>Acertos: ${correct} / 10<br>Erros: ${wrong}<br>Sem resposta: ${blank}<br>Aproveitamento: ${correct*10}%</div><button class="primary" onclick="restart()">REINICIAR</button></div>`}function render(){const introPage=index===-1,finished=index===Q.length;$('#content').innerHTML=introPage?intro():finished?score():side===0?qhtml(Q[index]):ahtml(Q[index]);$('#counter').textContent=introPage?'Tela inicial':finished?'Resultado':`Questão ${index+1}/10 • ${side?'RESPOSTA':'PERGUNTA'}`;$('#prev').disabled=introPage;$('#next').textContent=finished?'INÍCIO':'SEGUIR →';if(MODE==='professor'){const tools=$('#tools');tools.style.display=(introPage||finished)?'none':'flex';const sheet=$('.sheet');let board=document.createElement('canvas');board.id='board';sheet.appendChild(board);initCanvas(board);$('#penToggle').textContent=tool==='off'?'ATIVAR CANETA':'DESATIVAR CANETA';} }function choose(v){if(index<0||index>=10||side||MODE!=='aluno')return;choices[Q[index].n]=v;save();render()}function next(){if(index===10){index=-1;side=0}else if(index===-1){index=0;side=0}else if(side===0){side=1}else if(index===9){index=10;side=0}else{index++;side=0}render()}function prev(){if(index===10){index=9;side=1}else if(index===-1)return;else if(side===1)side=0;else if(index===0)index=-1;else{index--;side=1}render()}function restart(){if(confirm('Reiniciar este quiz e apagar respostas e anotações?')){choices={};marks={};save();index=-1;side=0;render()}}function flash(ok){const sh=$('.sheet');sh.style.boxShadow=ok?'0 0 0 9px #31b46d':'0 0 0 9px #f35d68';setTimeout(()=>sh.style.boxShadow='',450)}function teacherSignal(ok){flash(ok)}function setTool(t){tool=t;render()}function setColor(c){color=c;tool='pen';render()}function initCanvas(c){let rect=c.parentElement.getBoundingClientRect();c.width=Math.max(1,Math.round(rect.width*devicePixelRatio));c.height=Math.max(1,Math.round(rect.height*devicePixelRatio));let ctx=c.getContext('2d');ctx.scale(devicePixelRatio,devicePixelRatio);let w=rect.width,h=rect.height;let k=index+'-'+side;let strokes=marks[k]||[];function paint(st){if(!st.points.length)return;ctx.strokeStyle=st.color;ctx.lineWidth=st.width;ctx.globalAlpha=st.alpha||1;ctx.lineCap='round';ctx.lineJoin='round';ctx.beginPath();st.points.forEach((p,i)=>{let x=p[0]*w,y=p[1]*h;i?ctx.lineTo(x,y):ctx.moveTo(x,y)});if(st.points.length===1){let p=st.points[0];ctx.lineTo(p[0]*w+.1,p[1]*h+.1)}ctx.stroke();ctx.globalAlpha=1}strokes.forEach(paint);c.style.pointerEvents=tool==='off'?'none':'auto';c.style.cursor=tool==='erase'?'cell':'url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%2232%22%20height%3D%2232%22%20viewBox%3D%220%200%2032%2032%22%3E%3Cg%20transform%3D%22rotate%280%2016%2016%29%22%3E%3Cpath%20d%3D%22M5%2027%20L9%2017%20L22%204%20Q24%202%2027%205%20L29%207%20Q30%209%2028%2011%20L15%2024%20Z%22%20fill%3D%22%23f8f8fc%22%20stroke%3D%22%2317295c%22%20stroke-width%3D%221.6%22%2F%3E%3Cpath%20d%3D%22M9%2017%20L15%2024%20M22%204%20L28%2011%22%20stroke%3D%22%2317295c%22%20stroke-width%3D%221.5%22%2F%3E%3Cpath%20d%3D%22M5%2027%20L11%2024%22%20stroke%3D%22%2317295c%22%20stroke-width%3D%221.3%22%2F%3E%3Ccircle%20cx%3D%225%22%20cy%3D%2227%22%20r%3D%221.5%22%20fill%3D%22%23d62c3c%22%2F%3E%3C%2Fg%3E%3C%2Fsvg%3E") 5 27, crosshair';let active=null;c.onpointerdown=e=>{if(tool==='off')return;e.preventDefault();c.setPointerCapture(e.pointerId);let p=point(e);active={color:tool==='erase'?'#ffffff':color,width:tool==='erase'?25:tool==='highlighter'?22:size,alpha:tool==='highlighter'?.32:1,points:[p]};strokes.push(active);marks[k]=strokes;paint(active)};c.onpointermove=e=>{if(!active)return;e.preventDefault();active.points.push(point(e));ctx.clearRect(0,0,w,h);strokes.forEach(paint)};c.onpointerup=()=>{active=null;save()};c.onpointercancel=()=>{active=null;save()};function point(e){let r=c.getBoundingClientRect();return [(e.clientX-r.left)/r.width,(e.clientY-r.top)/r.height]}}function clearBoard(){if(index<0||index>=10)return;delete marks[index+'-'+side];save();render()}window.addEventListener('keydown',e=>{if(e.key==='ArrowRight')next();if(e.key==='ArrowLeft')prev()});render();</script></body></html>
